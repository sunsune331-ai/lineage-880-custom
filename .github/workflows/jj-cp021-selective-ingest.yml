name: JJ CP021 selective ingest
on:
  push:
    paths:
      - '.github/workflows/jj-cp021-selective-ingest.yml'
permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    concurrency:
      group: jj-ledger-ingest
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: CP-021 safe selective append commit push verify
        run: |
          base64 -d .github/jj_ingest/cp021_articles.gz.b64 | gzip -d > /tmp/jj_articles.jsonl
          base64 -d .github/jj_ingest/cp021_checkpoint.gz.b64 | gzip -d > /tmp/jj_checkpoint.jsonl
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python tools/jj_ledger.py validate
          python - <<'PY'
          import json
          from pathlib import Path
          a=[json.loads(x) for x in Path('research/article_ledger.jsonl').read_text(encoding='utf-8').splitlines()]
          c=[json.loads(x) for x in Path('research/checkpoint_ledger.jsonl').read_text(encoding='utf-8').splitlines()]
          incoming=[json.loads(x) for x in Path('/tmp/jj_articles.jsonl').read_text(encoding='utf-8').splitlines()]
          cp=[json.loads(x) for x in Path('/tmp/jj_checkpoint.jsonl').read_text(encoding='utf-8').splitlines()]
          assert a[-1]['id']=='JJ-000288', a[-1]['id']
          assert c[-1]['checkpoint_id']=='JJ-AIFIRST-CP-020', c[-1]['checkpoint_id']
          assert c[-1]['cumulative_completed']==288 and c[-1]['remaining']==495
          assert len(incoming)==10
          assert incoming[0]['id']=='JJ-000289' and incoming[-1]['id']=='JJ-000298'
          assert len(cp)==1 and cp[0]['checkpoint_id']=='JJ-AIFIRST-CP-021'
          assert cp[0]['cumulative_completed']==298 and cp[0]['remaining']==485
          assert all(r['read_status']=='complete' for r in incoming)
          assert all(r['evidence_level']=='research' and r['version_status']=='unverified' and r['eight_eight_status']=='unverified' for r in incoming)
          assert len({r['id'] for r in a+incoming})==len(a)+len(incoming)
          assert len({r['canonical_url'] for r in a+incoming})==len(a)+len(incoming)
          PY
          python tools/jj_ledger.py append --articles /tmp/jj_articles.jsonl --checkpoint /tmp/jj_checkpoint.jsonl --dry-run
          python tools/jj_ledger.py append --articles /tmp/jj_articles.jsonl --checkpoint /tmp/jj_checkpoint.jsonl
          python tools/jj_ledger.py validate
          SHA21=$(python tools/jj_ledger.py commit --message "JJ AI-first CP-021: selective deep-read JJ-000289 through JJ-000298" | tail -n 1)
          echo "SHA21=$SHA21" >> "$GITHUB_ENV"
          python tools/jj_ledger.py push
          git fetch origin main
          git show origin/main:research/article_ledger.jsonl > /tmp/remote_articles.jsonl
          git show origin/main:research/checkpoint_ledger.jsonl > /tmp/remote_checkpoints.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          def rd(p):
              rows=[]
              for i,line in enumerate(Path(p).read_text(encoding='utf-8').splitlines(),1):
                  assert line.strip(), (p,i,'blank')
                  rows.append(json.loads(line))
              return rows
          a=rd('/tmp/remote_articles.jsonl'); c=rd('/tmp/remote_checkpoints.jsonl')
          assert a[-1]['id']=='JJ-000298'
          assert c[-1]['checkpoint_id']=='JJ-AIFIRST-CP-021'
          assert c[-1]['cumulative_completed']==298 and c[-1]['total_articles']==783 and c[-1]['remaining']==485
          assert len({r['id'] for r in a})==len(a)
          assert len({r['canonical_url'] for r in a})==len(a)
          print('CP021_REMOTE_VERIFIED', a[-1]['id'], c[-1]['checkpoint_id'], c[-1]['cumulative_completed'], c[-1]['remaining'])
          PY

      - name: Report commit SHA
        run: echo "CP021_COMMIT=$SHA21"
