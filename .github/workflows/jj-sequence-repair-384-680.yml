name: JJ sequence repair 384-680

on:
  push:
    branches:
      - jj-scan-inbox
    paths:
      - '.github/workflows/jj-sequence-repair-384-680.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    concurrency:
      group: jj-sequence-repair-384-680
      cancel-in-progress: false
    steps:
      - name: Checkout producer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: jj-scan-inbox

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preflight, build candidate, rebuild 641-680, validate, commit and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main jj-scan-inbox
          python - <<'PY'
          import copy
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          EXPECTED_MAIN = "eb5461cc05b1a184353b1293e28e704953c647ce"
          EXPECTED_INBOX_BASE = "68abed29ce2b745d735840865002e0ffa36b3255"
          REPAIR_DIR = Path("research/incoming/site_scan/repair_20260910")
          CANDIDATE_MANIFEST = REPAIR_DIR / "formal_candidate_000001_000640.manifest.jsonl"
          CANDIDATE_SCAN = REPAIR_DIR / "formal_candidate_000001_000640.scan.jsonl"
          READY = REPAIR_DIR / "repair_ready.json"
          REPORT = REPAIR_DIR / "validation_report.json"
          IMMUTABLE = ("scan_id", "ordinal", "archive_page", "archive_position", "title", "published_at", "url", "canonical_url")

          def sh(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          def git_show(ref: str, path: str) -> str:
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)

          def read_jsonl_text(text: str):
              rows = []
              for i, line in enumerate(text.splitlines(), 1):
                  assert line.strip(), ("blank_jsonl", i)
                  rows.append(json.loads(line))
              return rows

          def read_jsonl(path: Path):
              return read_jsonl_text(path.read_text(encoding="utf-8"))

          def write_jsonl(path: Path, rows):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text("".join(json.dumps(r, ensure_ascii=False, separators=(",", ":")) + "\n" for r in rows), encoding="utf-8")

          def reindex(row, n: int):
              out = copy.deepcopy(row)
              out["scan_id"] = f"JJ-SCAN-{n:06d}"
              out["ordinal"] = n
              out["archive_page"] = (n - 1) // 10 + 1
              out["archive_position"] = (n - 1) % 10 + 1
              return out

          def article_identity(row):
              return (row["title"], row["published_at"], row["url"], row["canonical_url"])

          def assert_manifest_scan_pair(manifest, scan):
              assert len(manifest) == len(scan)
              for m, s in zip(manifest, scan):
                  for f in IMMUTABLE:
                      assert s.get(f) == m.get(f), (m.get("scan_id"), f, m.get(f), s.get(f))

          # FIRST PRINCIPLE / PRE-FLIGHT: if the verified direction no longer holds, stop before any repair.
          main_head = sh("git", "rev-parse", "origin/main")
          head = sh("git", "rev-parse", "HEAD")
          parent = sh("git", "rev-parse", "HEAD^")
          remote_inbox = sh("git", "rev-parse", "origin/jj-scan-inbox")
          assert main_head == EXPECTED_MAIN, ("main_head_changed", main_head)
          assert parent == EXPECTED_INBOX_BASE, ("inbox_base_changed", parent)
          assert head == remote_inbox, ("checkout_not_remote_head", head, remote_inbox)

          main_manifest = read_jsonl_text(git_show("origin/main", "research/site_scan_manifest.jsonl"))
          main_scan = read_jsonl_text(git_show("origin/main", "research/site_scan_ledger.jsonl"))
          assert len(main_manifest) == 630 and len(main_scan) == 630
          assert main_manifest[-1]["scan_id"] == "JJ-SCAN-000630"
          assert main_scan[-1]["scan_id"] == "JJ-SCAN-000630"
          assert_manifest_scan_pair(main_manifest, main_scan)

          old_manifest = {}
          old_scan = {}
          original_681_780_hashes = {}
          for start in range(631, 781, 10):
              end = start + 9
              mp = Path(f"research/incoming/site_scan/jj_scan_{start:06d}_{end:06d}.manifest.jsonl")
              sp = Path(f"research/incoming/site_scan/jj_scan_{start:06d}_{end:06d}.scan.jsonl")
              mrows = read_jsonl(mp)
              srows = read_jsonl(sp)
              assert len(mrows) == 10 and len(srows) == 10, (start, len(mrows), len(srows))
              assert_manifest_scan_pair(mrows, srows)
              for m, s in zip(mrows, srows):
                  assert m["ordinal"] not in old_manifest
                  old_manifest[m["ordinal"]] = m
                  old_scan[s["ordinal"]] = s
              if start >= 681:
                  original_681_780_hashes[str(mp)] = hashlib.sha256(mp.read_bytes()).hexdigest()
                  original_681_780_hashes[str(sp)] = hashlib.sha256(sp.read_bytes()).hexdigest()

          # Verify the two known error signatures before proceeding.
          assert main_manifest[382]["canonical_url"] == "https://morosedog.gitlab.io/private-lineage-20210801-private-lineage-20/"
          assert main_manifest[383]["canonical_url"] == "https://morosedog.gitlab.io/private-lineage-20210730-private-lineage-18/"
          assert old_manifest[670]["canonical_url"] == "https://morosedog.gitlab.io/ollydbg-20190713-OllyDBG-9/"
          assert old_manifest[671]["canonical_url"] == old_manifest[670]["canonical_url"]
          assert old_manifest[672]["canonical_url"] == "https://morosedog.gitlab.io/ollydbg-20190712-OllyDBG-8/"

          # PHASE 1: build corrected formal candidate 001..640.
          missing_manifest = {
              "scan_id": "JJ-SCAN-000384",
              "ordinal": 384,
              "archive_page": 39,
              "archive_position": 4,
              "title": "天堂私服 | 對外設定(數據機 & WiFi-DHCP)",
              "published_at": "2021-07-31",
              "url": "https://morosedog.gitlab.io/private-lineage-20210731-private-lineage-19/",
              "canonical_url": "https://morosedog.gitlab.io/private-lineage-20210731-private-lineage-19/",
          }
          missing_scan = {
              **missing_manifest,
              "classification": "LOW",
              "body_read": False,
              "rationale": "Archive index identity confirms this omitted Lineage private-server article is a modem/WiFi DHCP external-network setup entry. The body was not reread during sequence repair; it is retained as a shallow LOW networking-background assessment consistent with the adjacent deployment entries.",
              "matched_signals": ["modem", "WiFi", "DHCP", "network setup"],
              "already_in_ai_first_ledger": False,
          }

          candidate_manifest = [copy.deepcopy(r) for r in main_manifest[:383]]
          candidate_scan = [copy.deepcopy(r) for r in main_scan[:383]]
          candidate_manifest.append(missing_manifest)
          candidate_scan.append(missing_scan)
          for old_n in range(384, 631):
              candidate_manifest.append(reindex(main_manifest[old_n - 1], old_n + 1))
              candidate_scan.append(reindex(main_scan[old_n - 1], old_n + 1))
          for old_n in range(631, 640):
              candidate_manifest.append(reindex(old_manifest[old_n], old_n + 1))
              candidate_scan.append(reindex(old_scan[old_n], old_n + 1))

          assert len(candidate_manifest) == 640 and len(candidate_scan) == 640
          assert [r["ordinal"] for r in candidate_manifest] == list(range(1, 641))
          assert_manifest_scan_pair(candidate_manifest, candidate_scan)
          assert [article_identity(r) for r in candidate_manifest[:383]] == [article_identity(r) for r in main_manifest[:383]]
          assert candidate_manifest[383]["canonical_url"] == missing_manifest["canonical_url"]
          assert article_identity(candidate_manifest[630]) == article_identity(main_manifest[629])  # final 631 == old formal 630
          assert article_identity(candidate_manifest[631]) == article_identity(old_manifest[631])  # final 632 == old inbox 631
          assert article_identity(candidate_manifest[639]) == article_identity(old_manifest[639])  # final 640 == old inbox 639

          write_jsonl(CANDIDATE_MANIFEST, candidate_manifest)
          write_jsonl(CANDIDATE_SCAN, candidate_scan)

          # PHASE 2: validate candidate with the formal validator before touching staging.
          candidate_validation = subprocess.check_output([
              "python", "tools/site_scan_ledger.py",
              "--manifest", str(CANDIDATE_MANIFEST),
              "--ledger", str(CANDIDATE_SCAN),
              "validate",
          ], text=True).strip()
          cv = json.loads(candidate_validation)
          assert cv["record_count"] == 640
          assert cv["tail_id"] == "JJ-SCAN-000640"
          assert len({r["canonical_url"] for r in candidate_manifest}) == 640

          # PHASE 3: rebuild only affected staging batches 641..680 by article identity.
          final_manifest = {}
          final_scan = {}
          for n in range(641, 651):
              final_manifest[n] = reindex(old_manifest[n - 1], n)
              final_scan[n] = reindex(old_scan[n - 1], n)
          for n in range(651, 661):
              final_manifest[n] = reindex(old_manifest[n - 1], n)
              final_scan[n] = reindex(old_scan[n - 1], n)
          for n in range(661, 671):
              final_manifest[n] = reindex(old_manifest[n - 1], n)
              final_scan[n] = reindex(old_scan[n - 1], n)
          final_manifest[671] = reindex(old_manifest[670], 671)
          final_scan[671] = reindex(old_scan[670], 671)
          for n in range(672, 681):
              final_manifest[n] = reindex(old_manifest[n], n)
              final_scan[n] = reindex(old_scan[n], n)

          for start in (641, 651, 661, 671):
              end = start + 9
              mrows = [final_manifest[n] for n in range(start, end + 1)]
              srows = [final_scan[n] for n in range(start, end + 1)]
              assert_manifest_scan_pair(mrows, srows)
              write_jsonl(Path(f"research/incoming/site_scan/jj_scan_{start:06d}_{end:06d}.manifest.jsonl"), mrows)
              write_jsonl(Path(f"research/incoming/site_scan/jj_scan_{start:06d}_{end:06d}.scan.jsonl"), srows)

          # PHASE 4: validate corrected candidate + corrected 641..680 + unchanged 681..780 as one 001..780 sequence.
          combined_manifest = list(candidate_manifest)
          combined_scan = list(candidate_scan)
          for n in range(641, 681):
              combined_manifest.append(final_manifest[n])
              combined_scan.append(final_scan[n])
          for n in range(681, 781):
              combined_manifest.append(copy.deepcopy(old_manifest[n]))
              combined_scan.append(copy.deepcopy(old_scan[n]))

          assert len(combined_manifest) == 780 and len(combined_scan) == 780
          assert_manifest_scan_pair(combined_manifest, combined_scan)
          assert [r["scan_id"] for r in combined_manifest] == [f"JJ-SCAN-{n:06d}" for n in range(1, 781)]
          assert [r["ordinal"] for r in combined_manifest] == list(range(1, 781))
          for n, row in enumerate(combined_manifest, 1):
              assert row["archive_page"] == (n - 1) // 10 + 1
              assert row["archive_position"] == (n - 1) % 10 + 1
          assert len({r["canonical_url"] for r in combined_manifest}) == 780
          assert combined_manifest[383]["canonical_url"] == missing_manifest["canonical_url"]
          assert combined_manifest[670]["canonical_url"] == "https://morosedog.gitlab.io/ollydbg-20190713-OllyDBG-9/"
          assert combined_manifest[671]["canonical_url"] == "https://morosedog.gitlab.io/ollydbg-20190712-OllyDBG-8/"
          assert combined_manifest[691]["canonical_url"] == "https://morosedog.gitlab.io/cheatengine-20190622-cheatEngine2/"
          assert combined_manifest[779]["canonical_url"] == "https://morosedog.gitlab.io/springboot-20190314-springboot3/"

          tmp_manifest = Path("/tmp/jj_combined_001_780.manifest.jsonl")
          tmp_scan = Path("/tmp/jj_combined_001_780.scan.jsonl")
          write_jsonl(tmp_manifest, combined_manifest)
          write_jsonl(tmp_scan, combined_scan)
          combined_validation = subprocess.check_output([
              "python", "tools/site_scan_ledger.py",
              "--manifest", str(tmp_manifest),
              "--ledger", str(tmp_scan),
              "validate",
          ], text=True).strip()
          vv = json.loads(combined_validation)
          assert vv["record_count"] == 780
          assert vv["tail_id"] == "JJ-SCAN-000780"

          # Prove 681..780 stayed byte-identical.
          for path, before_hash in original_681_780_hashes.items():
              after_hash = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert after_hash == before_hash, ("unexpected_change_681_780", path)

          report = {
              "main_head_read": main_head,
              "inbox_head_start": EXPECTED_INBOX_BASE,
              "errors_repaired_in_candidate": 2,
              "formal_candidate_range": "JJ-SCAN-000001..JJ-SCAN-000640",
              "formal_candidate_count": 640,
              "formal_candidate_validator": json.loads(candidate_validation),
              "missing_article_inserted_at": "JJ-SCAN-000384",
              "duplicate_removed_source_id": "OLD JJ-SCAN-000671",
              "rebuilt_batches": ["641-650", "651-660", "661-670", "671-680"],
              "unchanged_verified_range": "681-780",
              "combined_range": "001-780",
              "combined_sequence_validation": json.loads(combined_validation),
              "canonical_duplicates": 0,
              "ordinal_gaps": 0,
              "status": "PRODUCER_REPAIR_READY",
          }
          REPAIR_DIR.mkdir(parents=True, exist_ok=True)
          REPORT.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          READY.write_text(json.dumps({
              "status": "ready",
              "repair": "JJ sequence omission 384 + duplicate old 671",
              "formal_candidate_manifest": str(CANDIDATE_MANIFEST),
              "formal_candidate_scan": str(CANDIDATE_SCAN),
              "formal_candidate_count": 640,
              "combined_validated_through": "JJ-SCAN-000780",
              "rebuilt_batches": ["641-650", "651-660", "661-670", "671-680"],
              "unchanged_range": "681-780",
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Allowed-change guard. Self-delete this temporary workflow so the final branch tree only keeps repair artifacts/data.
          subprocess.check_call(["git", "rm", ".github/workflows/jj-sequence-repair-384-680.yml"])
          status = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          allowed_prefixes = (
              "research/incoming/site_scan/repair_20260910/",
              "research/incoming/site_scan/jj_scan_000641_000650.manifest.jsonl",
              "research/incoming/site_scan/jj_scan_000641_000650.scan.jsonl",
              "research/incoming/site_scan/jj_scan_000651_000660.manifest.jsonl",
              "research/incoming/site_scan/jj_scan_000651_000660.scan.jsonl",
              "research/incoming/site_scan/jj_scan_000661_000670.manifest.jsonl",
              "research/incoming/site_scan/jj_scan_000661_000670.scan.jsonl",
              "research/incoming/site_scan/jj_scan_000671_000680.manifest.jsonl",
              "research/incoming/site_scan/jj_scan_000671_000680.scan.jsonl",
              ".github/workflows/jj-sequence-repair-384-680.yml",
          )
          for line in status:
              p = line[3:]
              assert any(p == prefix or p.startswith(prefix) for prefix in allowed_prefixes), ("unexpected_path", line)

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

          git add -A
          git diff --cached --check
          git commit -m "research: repair JJ sequence candidate 384-680"
          REPAIR_COMMIT=$(git rev-parse HEAD)
          git push origin HEAD:jj-scan-inbox
          git fetch origin jj-scan-inbox
          test "$REPAIR_COMMIT" = "$(git rev-parse origin/jj-scan-inbox)"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse origin/jj-scan-inbox^{tree})"
          echo "REPAIR_COMMIT=$REPAIR_COMMIT" >> "$GITHUB_ENV"

      - name: Remote readback proof
        run: |
          set -euo pipefail
          git show origin/jj-scan-inbox:research/incoming/site_scan/repair_20260910/repair_ready.json
          git show origin/jj-scan-inbox:research/incoming/site_scan/repair_20260910/validation_report.json
          ! git cat-file -e origin/jj-scan-inbox:.github/workflows/jj-sequence-repair-384-680.yml 2>/dev/null
          echo "PRODUCER_REPAIR_COMMIT=$REPAIR_COMMIT"
