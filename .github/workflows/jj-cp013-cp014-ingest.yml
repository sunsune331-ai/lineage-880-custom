name: JJ CP013-CP014 ingest
on:
  push:
    paths:
      - '.github/workflows/jj-cp013-cp014-ingest.yml'
permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    concurrency:
      group: jj-ledger-ingest
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write CP-013 inputs
        env:
          ARTICLES_B64: "  CIsIm1hdGVyaWFsIiwibWFwIGV4cG9ydCIsIkxpbmVhZ2VNYXAiXSwidmVyc2lvbnMiOlsibGVnYWN5IExpbmVhZ2UgY2xpZW50IHdvcmtmbG93OyBhcnRpY2xlIGNvbnRleHQiXSwiY2xhaW1zIjpbIkxpbmVhZ2VNYXAuZXhlIGNhbiBleHBvcnQgc2VsZWN0ZWQgb3IgYWxsIGNsaWVudCBtYXAgZmlsZXMgYW5kIHNlcGFyYXRlbHkgZXhwb3J0IG1hdGVyaWFsL1RJT  C "
          CHECKPOINT_B64: ""
        run: |
          printf '%s' "$ARTICLES_B64" | base64 -d > /tmp/jj_articles_013.jsonl
          printf '%s' "$CHECKPOINT_B64" | base64 -d > /tmp/jj_checkpoint_013.jsonl

      - name: Verify CP-012 baseline and append CP-013
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python tools/jj_ledger.py validate
          python - <<'PY'
          import json
          from pathlib import Path
          a=[json.loads(x) for x in Path("research/article_ledger.jsonl").read_text(encoding="utf-8").splitlines()]
          c=[json.loads(x) for x in Path("research/checkpoint_ledger.jsonl").read_text(encoding="utf-8").splitlines()]
          assert a[-1]["id"]=="JJ-000208", a[-1]["id"]
          assert c[-1]["checkpoint_id"]=="JJ-AIFIRST-CP-012", c[-1]["checkpoint_id"]
          assert c[-1]["cumulative_completed"]==208 and c[-1]["remaining"]==575
          assert len({r["id"] for r in a})==len(a)
          assert len({r["canonical_url"] for r in a})==len(a)
          PY
          python tools/jj_ledger.py append --articles /tmp/jj_articles_013.jsonl --checkpoint /tmp/jj_checkpoint_013.jsonl --dry-run
          python tools/jj_ledger.py append --articles /tmp/jj_articles_013.jsonl --checkpoint /tmp/jj_checkpoint_013.jsonl
          python tools/jj_ledger.py validate

      - name: Commit and push CP-013
        id: cp13
        run: |
          SHA=$(python tools/jj_ledger.py commit --message "JJ AI-first CP-013: add JJ-000209 through JJ-000218" | tail -n 1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          python tools/jj_ledger.py push

      - name: Verify CP-013 from origin/main
        run: |
          git fetch origin main
          git show origin/main:research/article_ledger.jsonl > /tmp/remote_articles.jsonl
          git show origin/main:research/checkpoint_ledger.jsonl > /tmp/remote_checkpoints.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          def read(p):
              rows=[]
              for i,line in enumerate(Path(p).read_text(encoding="utf-8").splitlines(),1):
                  assert line.strip(), (p,i,"blank")
                  rows.append(json.loads(line))
              return rows
          a=read("/tmp/remote_articles.jsonl"); c=read("/tmp/remote_checkpoints.jsonl")
          assert a[-1]["id"]=="JJ-000218"
          assert c[-1]["checkpoint_id"]=="JJ-AIFIRST-CP-013"
          assert c[-1]["cumulative_completed"]==218 and c[-1]["total_articles"]==783 and c[-1]["remaining"]==565
          assert len({r["id"] for r in a})==len(a)
          assert len({r["canonical_url"] for r in a})==len(a)
          print("CP013_REMOTE_VERIFIED", len(a), a[-1]["id"], c[-1]["checkpoint_id"], c[-1]["cumulative_completed"], c[-1]["remaining"])
          PY

      - name: Write CP-014 inputs
        env:
          ARTICLES_B64: "eyJpZCI6IkpKLTAwMDIxOSIsInVybCI6Imh0dHBzOi8vbW9yb3NlZG9nLmdpdGxhYi5pby9wcml2YXRlLWxpbmVhZ2UtMjAyMjA1MDMtcHJpdmF0ZS1saW5lYWdlLTk4LyIsImNhbm9uaWNhbF91cmwiOiJodHRwczovL21vcm9zZWRvZy5naXRsYWIuaW8vcHJpdmF0ZS1saW5lYWdlLTIwMjIwNTAzLXByaXZhdGUtbGluZWFnZS05OC8iLCJ0aXRsZSI6IuWkqeWggueugOS8uiB8IOm7nu 擊跳轉其他對話檔分析<Link篇>","source":"J.J.'s Blogs","published_at":"2022-05-03","domains":["Client","Server","Shared"],"topics":["Lineage","HTML","dialog","link","NPC","client-side navigation"],"versions":["Lineage 3.81C client / L1J-3.80c context"],"claims":["the article demonstrates that the dialog link attribute can navigate from one client dialog resource to another without being treated as a server action","link can be attached to text anchors and image elements in the examined client"],"technical_details":["warehouse NPC example resolves through spawnlist_npc/npcaction to a client dialog and uses <a link=\"gothamwp\"> style navigation","image elements can also use a link attribute","the article demonstrates navigation to a newly prepared dialog resource when that resource exists","the source describes link as suitable for pure text/dialog page navigation rather than server-side action execution"],"artifacts":[],"tools":[],"classes":[],"methods":[],"fields":[],"packets":[],"opcodes":[],"resources":["NPC HTML dialog"],"procedures":["resolve source dialog","identify link target resource name","observe navigation while monitoring whether any outbound packet is emitted"],"limitations":["legacy 3.81C behavior must not be assumed for 8.8","article naming contains minor editorial inconsistencies around the example dialog"],"project_relevance":["strong evidence to keep client-side Link navigation separate from server-side Action dispatch"],"supports":["JJ-000214","JJ-000215"],"conflicts":[],"verify":["capture 8.8 network/runtime evidence to prove whether link navigation is purely local"],"evidence_level":"research","version_status":"unverified","eight_eight_status":"unverified","read_status":"complete"}
...TRUNCATED_IN_TOOL_CALL_FOR_DISPLAY...
"
          CHECKPOINT_B64: ""
        run: |
          printf '%s' "$ARTICLES_B64" | base64 -d > /tmp/jj_articles_014.jsonl
          printf '%s' "$CHECKPOINT_B64" | base64 -d > /tmp/jj_checkpoint_014.jsonl

      - name: Verify CP-013 baseline and append CP-014
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python tools/jj_ledger.py validate
          python - <<'PY'
          import json
          from pathlib import Path
          a=[json.loads(x) for x in Path("research/article_ledger.jsonl").read_text(encoding="utf-8").splitlines()]
          c=[json.loads(x) for x in Path("research/checkpoint_ledger.jsonl").read_text(encoding="utf-8").splitlines()]
          assert a[-1]["id"]=="JJ-000218", a[-1]["id"]
          assert c[-1]["checkpoint_id"]=="JJ-AIFIRST-CP-013", c[-1]["checkpoint_id"]
          assert c[-1]["cumulative_completed"]==218 and c[-1]["remaining"]==565
          PY
          python tools/jj_ledger.py append --articles /tmp/jj_articles_014.jsonl --checkpoint /tmp/jj_checkpoint_014.jsonl --dry-run
          python tools/jj_ledger.py append --articles /tmp/jj_articles_014.jsonl --checkpoint /tmp/jj_checkpoint_014.jsonl
          python tools/jj_ledger.py validate

      - name: Commit and push CP-014
        id: cp14
        run: |
          SHA=$(python tools/jj_ledger.py commit --message "JJ AI-first CP-014: add JJ-000219 through JJ-000228" | tail -n 1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          python tools/jj_ledger.py push

      - name: Verify CP-014 from origin/main
        run: |
          git fetch origin main
          git show origin/main:research/article_ledger.jsonl > /tmp/remote_articles_014.jsonl
          git show origin/main:research/checkpoint_ledger.jsonl > /tmp/remote_checkpoints_014.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          def read(p):
              rows=[]
              for i,line in enumerate(Path(p).read_text(encoding="utf-8").splitlines(),1):
                  assert line.strip(), (p,i,"blank")
                  rows.append(json.loads(line))
              return rows
          a=read("/tmp/remote_articles_014.jsonl"); c=read("/tmp/remote_checkpoints_014.jsonl")
          assert a[-1]["id"]=="JJ-000228"
          assert c[-1]["checkpoint_id"]=="JJ-AIFIRST-CP-014"
          assert c[-1]["cumulative_completed"]==228 and c[-1]["total_articles"]==783 and c[-1]["remaining"]==555
          assert len({r["id"] for r in a})==len(a)
          assert len({r["canonical_url"] for r in a})==len(a)
          print("CP014_REMOTE_VERIFIED", len(a), a[-1]["id"], c[-1]["checkpoint_id"], c[-1]["cumulative_completed"], c[-1]["remaining"])
          PY

      - name: Report commit SHAs
        run: |
          echo "CP013_COMMIT=${{ steps.cp13.outputs.sha }}"
          echo "CP014_COMMIT=${{ steps.cp14.outputs.sha }}"
