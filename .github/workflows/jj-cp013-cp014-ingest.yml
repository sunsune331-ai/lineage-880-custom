name: JJ CP013-CP014 ingest
on:
  push:
    paths:
      - '.github/workflows/jj-cp013-cp014-ingest.yml'
permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    concurrency:
      group: jj-ledger-ingest
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: CP-013 safe append commit push verify
        run: |
          base64 -d .github/jj_ingest/cp013_articles.gz.b64 | gzip -d > /tmp/jj_articles.jsonl
          base64 -d .github/jj_ingest/cp013_checkpoint.gz.b64 | gzip -d > /tmp/jj_checkpoint.jsonl
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python tools/jj_ledger.py validate
          python - <<'PY'
          import json
          from pathlib import Path
          a=[json.loads(x) for x in Path('research/article_ledger.jsonl').read_text(encoding='utf-8').splitlines()]
          c=[json.loads(x) for x in Path('research/checkpoint_ledger.jsonl').read_text(encoding='utf-8').splitlines()]
          assert a[-1]['id']=='JJ-000208', a[-1]['id']
          assert c[-1]['checkpoint_id']=='JJ-AIFIRST-CP-012', c[-1]['checkpoint_id']
          assert c[-1]['cumulative_completed']==208 and c[-1]['remaining']==575
          assert len({r['id'] for r in a})==len(a)
          assert len({r['canonical_url'] for r in a})==len(a)
          PY
          python tools/jj_ledger.py append --articles /tmp/jj_articles.jsonl --checkpoint /tmp/jj_checkpoint.jsonl --dry-run
          python tools/jj_ledger.py append --articles /tmp/jj_articles.jsonl --checkpoint /tmp/jj_checkpoint.jsonl
          python tools/jj_ledger.py validate
          SHA13=$(python tools/jj_ledger.py commit --message "JJ AI-first CP-013: add JJ-000209 through JJ-000218" | tail -n 1)
          echo "SHA13=$SHA13" >> "$GITHUB_ENV"
          python tools/jj_ledger.py push
          git fetch origin main
          git show origin/main:research/article_ledger.jsonl > /tmp/remote_articles.jsonl
          git show origin/main:research/checkpoint_ledger.jsonl > /tmp/remote_checkpoints.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          def rd(p):
              rows=[]
              for i,line in enumerate(Path(p).read_text(encoding='utf-8').splitlines(),1):
                  assert line.strip(), (p,i,'blank')
                  rows.append(json.loads(line))
              return rows
          a=rd('/tmp/remote_articles.jsonl'); c=rd('/tmp/remote_checkpoints.jsonl')
          assert a[-1]['id']=='JJ-000218'
          assert c[-1]['checkpoint_id']=='JJ-AIFIRST-CP-013'
          assert c[-1]['cumulative_completed']==218 and c[-1]['total_articles']==783 and c[-1]['remaining']==565
          assert len({r['id'] for r in a})==len(a)
          assert len({r['canonical_url'] for r in a})==len(a)
          print('CP013_REMOTE_VERIFIED', a[-1]['id'], c[-1]['checkpoint_id'], c[-1]['cumulative_completed'], c[-1]['remaining'])
          PY

      - name: CP-014 safe append commit push verify
        run: |
          base64 -d .github/jj_ingest/cp014_articles.gz.b64 | gzip -d > /tmp/jj_articles.jsonl
          base64 -d .github/jj_ingest/cp014_checkpoint.gz.b64 | gzip -d > /tmp/jj_checkpoint.jsonl
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python tools/jj_ledger.py validate
          python - <<'PY'
          import json
          from pathlib import Path
          a=[json.loads(x) for x in Path('research/article_ledger.jsonl').read_text(encoding='utf-8').splitlines()]
          c=[json.loads(x) for x in Path('research/checkpoint_ledger.jsonl').read_text(encoding='utf-8').splitlines()]
          assert a[-1]['id']=='JJ-000218', a[-1]['id']
          assert c[-1]['checkpoint_id']=='JJ-AIFIRST-CP-013', c[-1]['checkpoint_id']
          assert c[-1]['cumulative_completed']==218 and c[-1]['remaining']==565
          PY
          python tools/jj_ledger.py append --articles /tmp/jj_articles.jsonl --checkpoint /tmp/jj_checkpoint.jsonl --dry-run
          python tools/jj_ledger.py append --articles /tmp/jj_articles.jsonl --checkpoint /tmp/jj_checkpoint.jsonl
          python tools/jj_ledger.py validate
          SHA14=$(python tools/jj_ledger.py commit --message "JJ AI-first CP-014: add JJ-000219 through JJ-000228" | tail -n 1)
          echo "SHA14=$SHA14" >> "$GITHUB_ENV"
          python tools/jj_ledger.py push
          git fetch origin main
          git show origin/main:research/article_ledger.jsonl > /tmp/remote_articles.jsonl
          git show origin/main:research/checkpoint_ledger.jsonl > /tmp/remote_checkpoints.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          def rd(p):
              rows=[]
              for i,line in enumerate(Path(p).read_text(encoding='utf-8').splitlines(),1):
                  assert line.strip(), (p,i,'blank')
                  rows.append(json.loads(line))
              return rows
          a=rd('/tmp/remote_articles.jsonl'); c=rd('/tmp/remote_checkpoints.jsonl')
          assert a[-1]['id']=='JJ-000228'
          assert c[-1]['checkpoint_id']=='JJ-AIFIRST-CP-014'
          assert c[-1]['cumulative_completed']==228 and c[-1]['total_articles']==783 and c[-1]['remaining']==555
          assert len({r['id'] for r in a})==len(a)
          assert len({r['canonical_url'] for r in a})==len(a)
          print('CP014_REMOTE_VERIFIED', a[-1]['id'], c[-1]['checkpoint_id'], c[-1]['cumulative_completed'], c[-1]['remaining'])
          PY

      - name: Report commit SHAs
        run: |
          echo "CP013_COMMIT=$SHA13"
          echo "CP014_COMMIT=$SHA14"
