name: JJ sequence repair v2

on:
  push:
    branches: [jj-scan-inbox]
    paths: ['.github/workflows/jj-sequence-repair-v2.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    concurrency:
      group: jj-sequence-repair-v2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: jj-scan-inbox
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Validate direction, build repair, validate, commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main jj-scan-inbox
          python - <<'PY'
          import copy, hashlib, json, subprocess
          from pathlib import Path

          EXPECTED_MAIN='eb5461cc05b1a184353b1293e28e704953c647ce'
          EXPECTED_INBOX_BASE='662937cfd12fd06edfc46596556d329d4b21c056'
          R=Path('research/incoming/site_scan/repair_20260910')
          CM=R/'formal_candidate_000001_000640.manifest.jsonl'
          CS=R/'formal_candidate_000001_000640.scan.jsonl'
          REPORT=R/'validation_report.json'
          READY=R/'repair_ready.json'
          IMM=('scan_id','ordinal','archive_page','archive_position','title','published_at','url','canonical_url')

          def sh(*a): return subprocess.check_output(a,text=True).strip()
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def rows(text): return [json.loads(x) for x in text.splitlines() if x.strip()]
          def rd(p): return rows(Path(p).read_text(encoding='utf-8'))
          def wr(p,rs):
              p=Path(p); p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(''.join(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n' for r in rs),encoding='utf-8')
          def reindex(r,n):
              o=copy.deepcopy(r); o['scan_id']=f'JJ-SCAN-{n:06d}'; o['ordinal']=n
              o['archive_page']=(n-1)//10+1; o['archive_position']=(n-1)%10+1
              return o
          def ident(r): return (r['title'],r.get('published_at'),r['url'],r['canonical_url'])
          def pair(ms,ss):
              assert len(ms)==len(ss)
              for m,s in zip(ms,ss):
                  for f in IMM: assert m.get(f)==s.get(f),(m.get('scan_id'),f)

          assert sh('git','rev-parse','origin/main')==EXPECTED_MAIN
          assert sh('git','rev-parse','HEAD^')==EXPECTED_INBOX_BASE
          assert sh('git','rev-parse','HEAD')==sh('git','rev-parse','origin/jj-scan-inbox')
          assert sh('git','rev-parse','HEAD:tools/site_scan_ledger.py')==sh('git','rev-parse','origin/main:tools/site_scan_ledger.py'),'validator_not_synced'

          mm=rows(show('origin/main','research/site_scan_manifest.jsonl'))
          ms=rows(show('origin/main','research/site_scan_ledger.jsonl'))
          assert len(mm)==630 and len(ms)==630 and mm[-1]['ordinal']==630 and ms[-1]['ordinal']==630
          pair(mm,ms)

          om,os={},{}; unchanged_hash={}
          for start in range(631,781,10):
              end=start+9
              mp=Path(f'research/incoming/site_scan/jj_scan_{start:06d}_{end:06d}.manifest.jsonl')
              sp=Path(f'research/incoming/site_scan/jj_scan_{start:06d}_{end:06d}.scan.jsonl')
              mr,sr=rd(mp),rd(sp); assert len(mr)==10 and len(sr)==10; pair(mr,sr)
              for a,b in zip(mr,sr): om[a['ordinal']]=a; os[b['ordinal']]=b
              if start>=681:
                  unchanged_hash[str(mp)]=hashlib.sha256(mp.read_bytes()).hexdigest()
                  unchanged_hash[str(sp)]=hashlib.sha256(sp.read_bytes()).hexdigest()

          assert mm[382]['canonical_url']=='https://morosedog.gitlab.io/private-lineage-20210801-private-lineage-20/'
          assert mm[383]['canonical_url']=='https://morosedog.gitlab.io/private-lineage-20210730-private-lineage-18/'
          assert om[670]['canonical_url']=='https://morosedog.gitlab.io/ollydbg-20190713-OllyDBG-9/'
          assert om[671]['canonical_url']==om[670]['canonical_url']
          assert om[672]['canonical_url']=='https://morosedog.gitlab.io/ollydbg-20190712-OllyDBG-8/'

          missing_m={'scan_id':'JJ-SCAN-000384','ordinal':384,'archive_page':39,'archive_position':4,'title':'天堂私服 | 對外設定(數據機 & WiFi-DHCP)','published_at':'2021-07-31','url':'https://morosedog.gitlab.io/private-lineage-20210731-private-lineage-19/','canonical_url':'https://morosedog.gitlab.io/private-lineage-20210731-private-lineage-19/'}
          missing_s={**missing_m,'classification':'LOW','body_read':False,'rationale':'Archive index identity confirms this omitted Lineage private-server article is an external network setup entry. Body was not reread during sequence repair; shallow LOW assessment is retained as networking/deployment background.','matched_signals':['modem','WiFi','DHCP','network setup'],'already_in_ai_first_ledger':False}

          cm=[copy.deepcopy(r) for r in mm[:383]]+[missing_m]
          cs=[copy.deepcopy(r) for r in ms[:383]]+[missing_s]
          for old in range(384,631): cm.append(reindex(mm[old-1],old+1)); cs.append(reindex(ms[old-1],old+1))
          for old in range(631,640): cm.append(reindex(om[old],old+1)); cs.append(reindex(os[old],old+1))
          assert len(cm)==640 and len(cs)==640; pair(cm,cs)
          assert [r['ordinal'] for r in cm]==list(range(1,641))
          assert ident(cm[630])==ident(mm[629]); assert ident(cm[631])==ident(om[631]); assert ident(cm[639])==ident(om[639])
          assert len({r['canonical_url'] for r in cm})==640
          wr(CM,cm); wr(CS,cs)
          cv=json.loads(subprocess.check_output(['python','tools/site_scan_ledger.py','--manifest',str(CM),'--ledger',str(CS),'validate'],text=True))
          assert cv['record_count']==640 and cv['tail_id']=='JJ-SCAN-000640'

          fm,fs={},{}
          for n in range(641,671): fm[n]=reindex(om[n-1],n); fs[n]=reindex(os[n-1],n)
          fm[671]=reindex(om[670],671); fs[671]=reindex(os[670],671)
          for n in range(672,681): fm[n]=reindex(om[n],n); fs[n]=reindex(os[n],n)
          for start in (641,651,661,671):
              end=start+9
              wr(f'research/incoming/site_scan/jj_scan_{start:06d}_{end:06d}.manifest.jsonl',[fm[n] for n in range(start,end+1)])
              wr(f'research/incoming/site_scan/jj_scan_{start:06d}_{end:06d}.scan.jsonl',[fs[n] for n in range(start,end+1)])

          allm=list(cm)+[fm[n] for n in range(641,681)]+[copy.deepcopy(om[n]) for n in range(681,781)]
          alls=list(cs)+[fs[n] for n in range(641,681)]+[copy.deepcopy(os[n]) for n in range(681,781)]
          assert len(allm)==780 and len(alls)==780; pair(allm,alls)
          assert [r['ordinal'] for r in allm]==list(range(1,781))
          assert [r['scan_id'] for r in allm]==[f'JJ-SCAN-{n:06d}' for n in range(1,781)]
          assert len({r['canonical_url'] for r in allm})==780
          assert allm[383]['canonical_url']==missing_m['canonical_url']
          assert allm[670]['canonical_url']=='https://morosedog.gitlab.io/ollydbg-20190713-OllyDBG-9/'
          assert allm[671]['canonical_url']=='https://morosedog.gitlab.io/ollydbg-20190712-OllyDBG-8/'
          assert allm[691]['canonical_url']=='https://morosedog.gitlab.io/cheatengine-20190622-cheatEngine2/'
          assert allm[779]['canonical_url']=='https://morosedog.gitlab.io/springboot-20190314-springboot3/'
          for n,r in enumerate(allm,1): assert r['archive_page']==(n-1)//10+1 and r['archive_position']==(n-1)%10+1

          tm=Path('/tmp/jj780m.jsonl'); ts=Path('/tmp/jj780s.jsonl'); wr(tm,allm); wr(ts,alls)
          vv=json.loads(subprocess.check_output(['python','tools/site_scan_ledger.py','--manifest',str(tm),'--ledger',str(ts),'validate'],text=True))
          assert vv['record_count']==780 and vv['tail_id']=='JJ-SCAN-000780'
          for p,h in unchanged_hash.items(): assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,('681_780_changed',p)

          report={'main_head_read':EXPECTED_MAIN,'inbox_head_start':EXPECTED_INBOX_BASE,'validator_blob':sh('git','rev-parse','HEAD:tools/site_scan_ledger.py'),'errors_repaired_in_candidate':2,'formal_candidate_range':'JJ-SCAN-000001..JJ-SCAN-000640','formal_candidate_count':640,'formal_candidate_validator':cv,'missing_article_inserted_at':'JJ-SCAN-000384','duplicate_removed_source_id':'OLD JJ-SCAN-000671','rebuilt_batches':['641-650','651-660','661-670','671-680'],'unchanged_verified_range':'681-780','combined_range':'001-780','combined_sequence_validation':vv,'canonical_duplicates':0,'ordinal_gaps':0,'status':'PRODUCER_REPAIR_READY'}
          R.mkdir(parents=True,exist_ok=True)
          REPORT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          READY.write_text(json.dumps({'status':'ready','repair':'384 omission + old 671 duplicate','formal_candidate_manifest':str(CM),'formal_candidate_scan':str(CS),'formal_candidate_count':640,'combined_validated_through':'JJ-SCAN-000780','rebuilt_batches':['641-650','651-660','661-670','671-680'],'unchanged_range':'681-780'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git add -f research/incoming/site_scan
          git diff --cached --check
          git commit -m "research: repair JJ sequence candidate 384-680"
          git push origin HEAD:jj-scan-inbox
