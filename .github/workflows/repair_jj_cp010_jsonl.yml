name: Repair JJ CP010 JSONL boundaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair_jj_cp010_jsonl.yml'

permissions:
  contents: write

jobs:
  repair-jsonl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Repair only CP010 append boundaries and validate ledgers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          article_path = Path('research/article_ledger.jsonl')
          checkpoint_path = Path('research/checkpoint_ledger.jsonl')
          article_text = article_path.read_text(encoding='utf-8')
          checkpoint_text = checkpoint_path.read_text(encoding='utf-8')

          article_bad = '}{"id":"JJ-000179"'
          checkpoint_bad = '}{"checkpoint_id":"JJ-AIFIRST-CP-010"'
          assert article_text.count(article_bad) == 1, f'unexpected article boundary count: {article_text.count(article_bad)}'
          assert checkpoint_text.count(checkpoint_bad) == 1, f'unexpected checkpoint boundary count: {checkpoint_text.count(checkpoint_bad)}'

          article_text = article_text.replace(article_bad, '}\n{"id":"JJ-000179"', 1)
          checkpoint_text = checkpoint_text.replace(checkpoint_bad, '}\n{"checkpoint_id":"JJ-AIFIRST-CP-010"', 1)
          if not article_text.endswith('\n'):
              article_text += '\n'
          if not checkpoint_text.endswith('\n'):
              checkpoint_text += '\n'

          article_path.write_text(article_text, encoding='utf-8', newline='\n')
          checkpoint_path.write_text(checkpoint_text, encoding='utf-8', newline='\n')

          articles = [json.loads(x) for x in article_text.splitlines() if x.strip()]
          checkpoints = [json.loads(x) for x in checkpoint_text.splitlines() if x.strip()]
          assert len(articles) == 100, f'unexpected article count: {len(articles)}'
          assert articles[0]['id'] == 'JJ-000089'
          assert len(checkpoints) == 10, f'unexpected checkpoint count: {len(checkpoints)}'
          assert [a['id'] for a in articles[-10:]] == [f'JJ-{i:06d}' for i in range(179, 189)]
          assert articles[-1]['id'] == 'JJ-000188'
          assert checkpoints[-1]['checkpoint_id'] == 'JJ-AIFIRST-CP-010'
          assert checkpoints[-1]['article_end_id'] == 'JJ-000188'
          assert checkpoints[-1]['cumulative_completed'] == 188
          assert checkpoints[-1]['total_articles'] == 783
          assert checkpoints[-1]['remaining'] == 595
          assert checkpoints[-1]['commit_sha'] == '1377e1b13bd99f83530fc201f4120d8c8b687972'
          assert len({a['id'] for a in articles}) == len(articles)
          assert len({a.get('canonical_url') for a in articles}) == len(articles)
          print('JSONL_REPAIR_VALIDATED', len(articles), len(checkpoints), articles[0]['id'], articles[-1]['id'], checkpoints[-1]['checkpoint_id'])
          PY
          git config user.name 'sunsune331-ai'
          git config user.email 'sunsune331@gmail.com'
          git add -f research/article_ledger.jsonl research/checkpoint_ledger.jsonl
          git commit -m 'fix: restore JJ CP-010 JSONL record boundaries'
          git push origin HEAD:main
