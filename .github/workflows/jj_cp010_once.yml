name: JJ CP010 one-shot append

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jj_cp010_once.yml'

permissions:
  contents: write

jobs:
  append-ledgers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Validate baseline and append article ledger
