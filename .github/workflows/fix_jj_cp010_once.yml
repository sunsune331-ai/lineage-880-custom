name: Fix JJ CP010 one-shot workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix_jj_cp010_once.yml'

permissions:
  contents: write

jobs:
  fix-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Patch CP010 staging and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/jj_cp010_once.yml')
          s = p.read_text(encoding='utf-8')
          old_article = 'git add research/article_ledger.jsonl'
          old_checkpoint = 'git add research/checkpoint_ledger.jsonl'
          assert s.count(old_article) == 1, f'unexpected article git add count: {s.count(old_article)}'
          assert s.count(old_checkpoint) == 1, f'unexpected checkpoint git add count: {s.count(old_checkpoint)}'
          s = s.replace(old_article, 'git add -f research/article_ledger.jsonl', 1)
          s = s.replace(old_checkpoint, 'git add -f research/checkpoint_ledger.jsonl', 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- .github/workflows/jj_cp010_once.yml
          git config user.name 'sunsune331-ai'
          git config user.email 'sunsune331@gmail.com'
          git add .github/workflows/jj_cp010_once.yml
          git rm .github/workflows/fix_jj_cp010_once.yml
          git commit -m 'fix: force-stage JJ CP-010 research ledgers'
          git push origin HEAD:main
